name: Deploya Adversus-kopplingen till Claude

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/deploy-mcp.yml']
  workflow_dispatch:

concurrency: deploy-mcp

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_NAME: indivd-integrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Kontrollera att allt är inlagt
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Secret SUPABASE_ACCESS_TOKEN saknas i GitHub"; exit 1; }
          [ -n "${{ secrets.CONNECTOR_PASSWORD }}" ] || { echo "::error::Secret CONNECTOR_PASSWORD saknas i GitHub"; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Hitta eller skapa Supabase-projektet
        run: |
          ref=$(supabase projects list -o json | jq -r --arg n "$PROJECT_NAME" '.[] | select(.name==$n) | .id' | head -1)
          if [ -z "$ref" ]; then
            org=$(supabase orgs list -o json | jq -r '.[0].id')
            echo "Skapar $PROJECT_NAME i Stockholm (org $org)"
            # Databaslösenordet används inte av kopplingen; det kan återställas i Supabase vid behov.
            supabase projects create "$PROJECT_NAME" --org-id "$org" --region eu-north-1 \
              --db-password "$(openssl rand -base64 32 | tr -d '/+=')" -o json > /tmp/p.json
            ref=$(jq -r '.id' /tmp/p.json)
            echo "Väntar på att projektet startar…"
            for i in $(seq 1 40); do
              status=$(supabase projects list -o json | jq -r --arg r "$ref" '.[] | select(.id==$r) | .status')
              [ "$status" = "ACTIVE_HEALTHY" ] && break
              sleep 15
            done
          fi
          [ -n "$ref" ] && [ "$ref" != "null" ] || { echo "::error::Kunde inte hitta eller skapa projektet"; exit 1; }
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"
          echo "Supabase-projekt: $ref"
      - name: Sätt hemligheter i Supabase
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            ADVERSUS_USER="${{ secrets.ADVERSUS_USER }}" \
            ADVERSUS_PASSWORD="${{ secrets.ADVERSUS_PASSWORD }}" \
            CONNECTOR_PASSWORD="${{ secrets.CONNECTOR_PASSWORD }}" \
            PUBLIC_URL="https://$PROJECT_REF.supabase.co/functions/v1/adversus-mcp"
      - name: Deploya funktionen
        # Supabase egen JWT-kontroll stängs av: funktionen har sin egen inloggning (OAuth + lösenord).
        run: supabase functions deploy adversus-mcp --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Snabbtest
        run: |
          URL="https://$PROJECT_REF.supabase.co/functions/v1/adversus-mcp"
          curl -sf "$URL/.well-known/oauth-protected-resource" | tee /dev/stderr | grep -q authorization_servers
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL" -H 'content-type: application/json' -d '{}')
          [ "$code" = "401" ] || { echo "::error::Förväntade 401 utan inloggning, fick $code"; exit 1; }
          echo "Koppling till Claude: $URL"
          echo "### Klart ✅  Lägg till i Claude: \`$URL\`" >> "$GITHUB_STEP_SUMMARY"
