name: Skapa Garba-fälten i HubSpot

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/setup-garba.js
